name: Docs P0 Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs-p0:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.18
          install: true
          cache: true

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Collect documentation changes
        id: changed
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 hack/scripts/collect_changed_docs.py \
            --event-name "$EVENT_NAME" \
            --head "$HEAD_SHA" \
            --base-ref "$BASE_REF" \
            --before "$BEFORE_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --list-file "$RUNNER_TEMP/docs-p0-changed-files" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Run P0 doc checks
        if: steps.changed.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          changed_file_list="$RUNNER_TEMP/docs-p0-changed-files"
          mapfile -d '' changed_files < "$changed_file_list"
          audit_args=(--strict)
          for changed_file in "${changed_files[@]}"; do
            audit_args+=("--files=$changed_file")
          done
          python3 hack/scripts/audit_doc_frontmatter.py "${audit_args[@]}"

      # The pre-commit hook refreshes `last_updated` on staged pages. This
      # catches commits that skipped the hook (`--no-verify`) and pages whose
      # body changed under a date nobody bumped. It scans the whole tree rather
      # than the changed-file subset: the changed list only contains pages this
      # pull request touched, so a scoped run would miss staleness introduced
      # by an earlier merge into the base branch.
      - name: Check documentation timestamps
        if: steps.changed.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 hack/scripts/audit_doc_frontmatter.py --strict --check-stale-timestamps

      - name: Vale
        if: steps.changed.outputs.has_files == 'true'
        uses: vale-cli/vale-action@v2
        with:
          files: ${{ steps.changed.outputs.files }}
          version: 3.23.0
          fail_on_error: true

      - name: Docs tests
        if: steps.changed.outputs.has_inputs == 'true'
        shell: bash
        run: mise run test-docs

      - name: No documentation inputs
        if: steps.changed.outputs.has_inputs != 'true'
        shell: bash
        run: echo "No documentation inputs changed; Docs P0 completed as a no-op."
