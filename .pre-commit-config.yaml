repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt (staged Go files)
        # Stock `gofmt -l` lists unformatted files but always exits 0, and the
        # mise-pinned Go toolchain (go = "1.27.3" in .mise.toml) has no --fail
        # flag. This wrapper prints offending paths and exits 1 so the commit is
        # blocked. gofmt is resolved via the mise shim on PATH, matching the vale
        # hook convention below.
        entry: hack/scripts/check_gofmt.sh
        language: system
        types: [go]
        require_serial: true
      - id: golangci-lint
        name: golangci-lint (whole module)
        # Runs the pinned golangci-lint (golangci-lint = "2.14.0" in .mise.toml)
        # against .golangci.yml, mirroring the `lint` job in
        # .github/workflows/test.yml so a violation is caught at commit time
        # rather than at PR time. golangci-lint operates on packages, not
        # individual files, so pass_filenames is false and the whole module is
        # linted serially; the uncapped flags disable golangci-lint's default
        # 50-issues-per-run and 3-per-same-linter limits so a backlog cannot
        # hide behind the cap. The hook only fires when a .go file is staged.
        entry: golangci-lint run ./... --max-issues-per-linter 0 --max-same-issues 0
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
      - id: staged-documentation-policy
        name: Require maintained docs for public behavior changes
        entry: python3 hack/scripts/check_staged_docs.py
        language: system
        pass_filenames: true
        # The policy compares qualifying implementation files against maintained
        # docs across the whole changeset. pre-commit otherwise splits the file
        # list into several parallel invocations, so an implementation file can
        # land in a batch without the accompanying doc and fail spuriously.
        # require_serial forces a single invocation that sees every changed file.
        require_serial: true
      - id: doc-last-updated-refresh
        name: Refresh last_updated on staged docs
        # Stale `last_updated` values are otherwise invisible: a content edit
        # leaves the old date untouched, and the frontmatter audit only checks
        # the format. This hook rewrites the timestamp on every staged
        # maintained page so the committed value reflects the commit that
        # touched the file. pass_filenames supplies the staged set; the script
        # ignores anything that is not maintained documentation.
        entry: python3 hack/scripts/audit_doc_frontmatter.py --refresh-staged
        language: system
        files: ^docs/.*\.md$
        pass_filenames: true
        require_serial: true
      - id: doc-frontmatter
        name: Validate docs frontmatter (Diátaxis keys + YAML-safe values)
        entry: python3 hack/scripts/audit_doc_frontmatter.py --strict --files
        language: system
        files: ^docs/.*\.md$
        pass_filenames: true
      - id: vale
        name: Vale prose lint (staged Markdown)
        # Vale is provisioned by mise (pinned to vale = "3.23.0" in .mise.toml)
        # and resolved via the mise shim on PATH, both locally (`mise install`)
        # and in CI (jdx/mise-action in .github/workflows/pre-commit.yaml). Keep
        # that pin in sync with the version in .github/workflows/docs-p0.yml.
        entry: vale
        language: system
        types: [markdown]
        require_serial: true
