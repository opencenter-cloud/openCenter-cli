apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
spec:
  schedule: "0 1 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  # A backup that cannot schedule or finish must not stack a new one each day.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          initContainers:
            - name: etcd-backup
              image: csengteam/etcd-backup@sha256:c1ba8c236d4b6ca45b61df9356b540abbb9ede20d8613b0012631b79123d84bc
              env:
                - name: ETCDCTL_API
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-secrets
                      key: ETCDCTL-API
                - name: ETCDCTL_ENDPOINTS
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-secrets
                      key: ETCDCTL-ENDPOINTS
                - name: ETCDCTL_CACERT
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-secrets
                      key: ETCDCTL-CACERT
                - name: ETCDCTL_CERT
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-secrets
                      key: ETCDCTL-CERT
                - name: ETCDCTL_KEY
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-secrets
                      key: ETCDCTL-KEY
              command: ["/bin/bash", "-c"]
              args: ["etcdctl snapshot save /data/etcd-backup/etcd-snapshot-$(date +%Y-%m-%d).db"]
              volumeMounts:
                - mountPath: /etc/kubernetes/ssl/etcd
                  name: etcd-certs
                  readOnly: true
                - mountPath: /data/etcd-backup
                  name: etcd-backup
          restartPolicy: Never
          containers:
            - name: backup-to-s3
              image: csengteam/etcd-backup@sha256:c1ba8c236d4b6ca45b61df9356b540abbb9ede20d8613b0012631b79123d84bc
              env:
                - name: ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-secrets
                      key: ACCESS-KEY
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-secrets
                      key: SECRET-KEY
                - name: S3_HOST
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-secrets
                      key: S3-HOST
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-secrets
                      key: S3-REGION
                - name: S3_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-secrets
                      key: S3-BUCKET-NAME
              command: ["/bin/bash", "-c"]
              args: ["python /backup.py /data/etcd-backup/etcd-snapshot-$(date +%Y-%m-%d).db"]
              volumeMounts:
                - mountPath: /backup.py
                  name: backup-script
                  subPath: backup.py
                  readOnly: true
                - mountPath: /data/etcd-backup
                  name: etcd-backup
          hostNetwork: true
          # Without this a host-network pod uses the node's resolver and cannot reach an in-cluster S3 endpoint
          # such as http://<service>.<namespace>.svc.cluster.local.
          dnsPolicy: ClusterFirstWithHostNet
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: is-etcd-backup-node
                        operator: Exists
          tolerations:
            - key: node.kubernetes.io/memory-pressure
              effect: NoSchedule
              operator: Exists
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
              operator: Exists
          volumes:
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/ssl/etcd
                type: Directory
            - name: etcd-backup
              hostPath:
                path: /data/etcd-backup
                type: DirectoryOrCreate
            - name: backup-script
              configMap:
                name: etcd-backup-upload-script
                defaultMode: 0555
